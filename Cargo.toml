[workspace]
members = ["crates/apprise-core", "crates/apprise-cli", "crates/apprise-napi"]
resolver = "2"

[workspace.package]
version = "2.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "fs"] }

# HTTP client
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "multipart", "form", "query"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { version = "0.9" }

# URL parsing
url = "2"

# Email
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls-tls", "builder"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi"] }

# Error handling
thiserror = "2"

# Encoding
base64 = "0.22"

# System paths
dirs = "6"

# Compression (persistent storage files, pure Rust backend)
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# MIME type detection from file names (already used by reqwest multipart)
mime_guess = "2"

# Random
rand = "0.10"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async trait
async-trait = "0.1"

# URL encoding
urlencoding = "2"

# Regular expressions (email address parsing)
regex-lite = "0.1"
indexmap = "2"

# Cryptographic primitives
hmac = "0.13"
md-5 = "0.11"
sha2 = "0.11"
sha1 = "0.11"
hex = "0.4"
# ECDH/ECDSA P-256, RSA signing, HKDF and AES-GCM (VAPID, FCM); already
# linked through rustls, so it adds no code to the binary
ring = { version = "0.17", default-features = false, features = ["alloc"] }
# AES-GCM with 128/192/256-bit keys (Bark); ring has no AES-192
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
# AES-256-CBC for Pushover end-to-end encryption (the aes cipher comes
# from aes-gcm)
cbc = { version = "0.2", default-features = false, features = ["block-padding", "alloc"] }
# Simplepush end-to-end encryption (libsodium-compatible: Argon2id key
# derivation, XChaCha20-Poly1305 fields, crypto_box organization key wraps)
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets"] }
salsa20 = { version = "0.11", default-features = false }
poly1305 = { version = "0.9", default-features = false }

# Ed25519 signing and BLAKE2b hashing (Session Open Group Server)
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
blake2 = "0.10"

# Platform socket options
socket2 = { version = "0.6", features = ["all"] }

# TLS for raw TCP plugins (IRC, XMPP)
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
webpki-roots = "1"

# AMQP 1.0 (optional); AMQP 0-9-1 is built in
fe2o3-amqp = { version = "0.18", default-features = false }

# Desktop notifications (optional): D-Bus, icon decoding, Win32
zbus = { version = "6", default-features = false, features = ["tokio"] }
png = "0.18"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# USB HID devices (optional, blink(1)); the Linux backend is pure Rust
hidapi = { version = "2", default-features = false, features = ["linux-native-basic-udev", "windows-native"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Internal crate
apprise-core = { path = "crates/apprise-core" }

# Dev dependencies
wiremock = "0.6"
tokio-test = "0.4"
tempfile = "3"

[profile.release]
opt-level = "z"
strip = true
lto = true
codegen-units = 1
panic = "abort"
