[package]
name = "apprise-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Push notifications that work with everything — core library"

[lib]
name = "apprise_core"

[dependencies]
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = { workspace = true, optional = true }
url.workspace = true
lettre = { workspace = true, optional = true }
tracing.workspace = true
thiserror.workspace = true
base64.workspace = true
dirs.workspace = true
flate2.workspace = true
mime_guess.workspace = true
rand.workspace = true
chrono.workspace = true
async-trait.workspace = true
urlencoding.workspace = true
regex-lite.workspace = true
indexmap.workspace = true
hmac.workspace = true
md-5.workspace = true
sha2.workspace = true
sha1.workspace = true
hex.workspace = true
ed25519-dalek.workspace = true
blake2.workspace = true
ring.workspace = true
aes-gcm.workspace = true
cbc.workspace = true
argon2 = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
x25519-dalek = { workspace = true, optional = true }
salsa20 = { workspace = true, optional = true }
poly1305 = { workspace = true, optional = true }
socket2.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
hidapi = { workspace = true, optional = true }
png = { workspace = true, optional = true }
fe2o3-amqp = { workspace = true, optional = true }
tracing-subscriber.workspace = true

[features]
default = ["mqtt", "amqp", "email", "yaml", "images", "simplepush-encryption"]
mqtt = []
amqp = ["dep:fe2o3-amqp"]
email = ["dep:lettre"]
yaml = ["dep:serde_yaml"]
desktop = ["dep:png", "dep:zbus", "dep:windows-sys"]
blink1 = ["dep:hidapi"]
# Bundle the default theme's PNG icons for AppriseAsset::image_raw() (~280 KB).
images = []
simplepush-encryption = ["dep:argon2", "dep:chacha20poly1305", "dep:x25519-dalek", "dep:salsa20", "dep:poly1305"]

[target.'cfg(unix)'.dependencies]
# p2p lets the tests talk to a fake notification service
zbus = { workspace = true, optional = true, features = ["p2p"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
wiremock.workspace = true
tokio-test.workspace = true
tempfile.workspace = true
fe2o3-amqp = { workspace = true, features = ["acceptor"] }
