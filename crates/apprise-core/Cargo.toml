[package]
name = "apprise-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Push notifications that work with everything — core library"

[lib]
name = "apprise_core"

[dependencies]
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = { workspace = true, optional = true }
url.workspace = true
lettre = { workspace = true, optional = true }
tracing.workspace = true
thiserror.workspace = true
base64.workspace = true
dirs.workspace = true
rand.workspace = true
chrono.workspace = true
async-trait.workspace = true
urlencoding.workspace = true
hmac.workspace = true
sha2.workspace = true
sha1.workspace = true
hex.workspace = true
ring.workspace = true
aes-gcm.workspace = true
argon2 = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
x25519-dalek = { workspace = true, optional = true }
salsa20 = { workspace = true, optional = true }
poly1305 = { workspace = true, optional = true }
socket2.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
rumqttc = { workspace = true, optional = true }
notify-rust = { workspace = true, optional = true }
tracing-subscriber.workspace = true

[features]
default = ["mqtt", "email", "yaml", "simplepush-encryption"]
mqtt = ["dep:rumqttc"]
email = ["dep:lettre"]
yaml = ["dep:serde_yaml"]
desktop = ["dep:notify-rust"]
simplepush-encryption = ["dep:argon2", "dep:chacha20poly1305", "dep:x25519-dalek", "dep:salsa20", "dep:poly1305"]

[dev-dependencies]
wiremock.workspace = true
tokio-test.workspace = true
tempfile.workspace = true
