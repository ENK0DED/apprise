[package]
name = "apprise-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Push notifications that work with everything — CLI"

[[bin]]
name = "apprise"
path = "src/main.rs"

[dependencies]
apprise-core.workspace = true
chrono.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true

[features]
default = ["apprise-core/default"]
mqtt = ["apprise-core/mqtt"]
amqp = ["apprise-core/amqp"]
email = ["apprise-core/email"]
pgp = ["apprise-core/pgp"]
yaml = ["apprise-core/yaml"]
desktop = ["apprise-core/desktop"]
blink1 = ["apprise-core/blink1"]
images = ["apprise-core/images"]
matrix-e2ee = ["apprise-core/matrix-e2ee"]
simplepush-encryption = ["apprise-core/simplepush-encryption"]
